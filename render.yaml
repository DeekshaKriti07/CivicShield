services:
  - type: web
    name: civicshield-app
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: NODE_VERSION
        value: 24.22.1
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: civicshield-db
          property: connectionString
      - key: AI_ENABLED
        value: "false"
      - key: ALLOWED_ORIGINS
        value: ""

databases:
  - name: civicshield-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
